# LiveSync Bridge validation pipeline for isityael/livesync-bridge.
# GHCR publication, SBOM generation, vulnerability gating, and signing are
# canonicalized in .github/workflows/publish-ghcr.yaml.
when:
  - event: manual
  - event: push
    branch: main
    path:
      include:
        - Dockerfile
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - "**/*.ts"
        - runtime/**
        - scripts/**
        - lib/**
        - .woodpecker/build.yaml
        - .forgejo/workflows/release-tag.yaml
        - hack/wait-for-woodpecker-success.sh
        - .ci/test-release-policy.sh
  - event: pull_request
  - event: tag
    ref: refs/tags/v*-ym.*

variables:
  - &node_image "dhi.io/node:26.7.0-alpine3.24-dev@sha256:b6045b1e4dce4d1757211da1926ad47e1fc272fe15c454923a6d9d9746274575"
  - &pnpm_install "corepack enable && pnpm config set store-dir $CI_WORKSPACE/.pnpm-store && pnpm install --frozen-lockfile --ignore-scripts"

steps:
  - name: restore-pnpm-cache
    image: plugins/cache:1.10@sha256:1ff8584ff4e1d245fbb5e19350901c8f995cf2f32f2618f687445e8535003121
    failure: ignore
    settings:
      access_key: { from_secret: garage_s3_access_key }
      secret_key: { from_secret: garage_s3_secret_key }
      restore: true
      backend: s3
      endpoint: http://garage.garage.svc.cluster.local:3900
      bucket: buildkit-cache
      region: garage
      path_style: true
      archive_format: zstd
      cache_key: 'woodpecker/livesync-bridge/pnpm/amd64/node26-{{ checksum "pnpm-lock.yaml" }}'
      mount: [.pnpm-store]

  - name: pnpm-install
    image: *node_image
    commands:
      - *pnpm_install

  - name: fmt-check
    image: *node_image
    commands:
      - *pnpm_install
      - pnpm run fmt:check

  - name: lint
    image: *node_image
    commands:
      - *pnpm_install
      - pnpm run lint

  - name: typecheck
    image: *node_image
    commands:
      - *pnpm_install
      - pnpm run typecheck

  - name: test
    image: *node_image
    commands:
      - *pnpm_install
      - pnpm test

  - name: dependency-audit
    image: *node_image
    commands:
      - *pnpm_install
      - pnpm audit --audit-level=high

  - name: build
    image: *node_image
    commands:
      - *pnpm_install
      - pnpm run build

  - name: build-candidate
    image: woodpeckerci/plugin-docker-buildx:6.1.1@sha256:9a22c00b4952e405d11e66d29772edbeb1f7b24f27f71cda251ecb838e725e86
    privileged: true
    when:
      - event: tag
    settings:
      registry: ghcr.io
      repo: ghcr.io/isityael/livesync-bridge
      dockerfile: Dockerfile
      platforms: [linux/amd64]
      tags:
        - candidate-${CI_COMMIT_SHA}
      cache_from: 'type=registry\,ref=ghcr.io/isityael/livesync-bridge:buildcache'
      cache_to: "type=registry,ref=ghcr.io/isityael/livesync-bridge:buildcache,mode=max,ignore-error=true"
      logins:
        - registry: ghcr.io
          username:
            from_secret: github_username
          password:
            from_secret: github_token
        - registry: dhi.io
          username:
            from_secret: dhi_username
          password:
            from_secret: dhi_password
      provenance: mode=max

  - name: scan-candidate
    image: dhi.io/trivy:0.74.0-alpine3.24-dev@sha256:7e1173e976c07f3489a1897f9b227c94b477f5303b4ffc8ba43a99c27cfd16a9
    when:
      - event: tag
    environment:
      TRIVY_USERNAME:
        from_secret: github_username
      TRIVY_PASSWORD:
        from_secret: github_token
    commands:
      - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "ghcr.io/isityael/livesync-bridge:candidate-$${CI_COMMIT_SHA}"

  - name: sign-candidate
    image: dhi.io/cosign:3.1.3-alpine3.24-dev@sha256:656a211601ce9f746766b6dab95b2dc7546e1e00f04a2f43442e353bd916e98c
    when:
      - event: tag
    environment:
      COSIGN_EXPERIMENTAL: "1"
      COSIGN_KEY:
        from_secret: cosign_key
      COSIGN_PASSWORD:
        from_secret: cosign_password
      GHCR_USERNAME:
        from_secret: github_username
      GHCR_TOKEN:
        from_secret: github_token
    commands:
      - printf '%s' "$${COSIGN_KEY}" > /tmp/cosign.key
      - printf '%s' "$${GHCR_TOKEN}" | cosign login ghcr.io -u "$${GHCR_USERNAME}" --password-stdin
      - cosign sign --key /tmp/cosign.key --yes --registry-referrers-mode=oci-1-1 "ghcr.io/isityael/livesync-bridge:candidate-$${CI_COMMIT_SHA}"
      - rm -f /tmp/cosign.key

  - name: promote-release
    image: dhi.io/crane:0.21.9-debian13-dev@sha256:a59868f1520dbb3c83c59ca82320ed0c0bce72730802c427b70c420b60777c99
    when:
      - event: tag
    environment:
      GHCR_USERNAME:
        from_secret: github_username
      GHCR_TOKEN:
        from_secret: github_token
    commands:
      - printf '%s' "$${GHCR_TOKEN}" | crane auth login ghcr.io -u "$${GHCR_USERNAME}" --password-stdin
      - candidate="ghcr.io/isityael/livesync-bridge:candidate-$${CI_COMMIT_SHA}"
      - short_sha="$$(printf '%s' "$${CI_COMMIT_SHA}" | cut -c1-8)"
      - crane copy "$${candidate}" "ghcr.io/isityael/livesync-bridge:sha-$${CI_COMMIT_SHA}"
      - crane copy "$${candidate}" "ghcr.io/isityael/livesync-bridge:sha-$${short_sha}"
      - crane copy "$${candidate}" "ghcr.io/isityael/livesync-bridge:${CI_COMMIT_TAG}"
      - crane copy "$${candidate}" ghcr.io/isityael/livesync-bridge:latest

  - name: rebuild-pnpm-cache
    image: plugins/cache:1.10@sha256:1ff8584ff4e1d245fbb5e19350901c8f995cf2f32f2618f687445e8535003121
    failure: ignore
    when:
      - event: push
        branch: main
      - event: tag
    settings:
      access_key: { from_secret: garage_s3_access_key }
      secret_key: { from_secret: garage_s3_secret_key }
      rebuild: true
      backend: s3
      endpoint: http://garage.garage.svc.cluster.local:3900
      bucket: buildkit-cache
      region: garage
      path_style: true
      archive_format: zstd
      cache_key: 'woodpecker/livesync-bridge/pnpm/amd64/node26-{{ checksum "pnpm-lock.yaml" }}'
      mount: [.pnpm-store]
