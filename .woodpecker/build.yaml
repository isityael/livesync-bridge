# Canonical LiveSync Bridge validation and private Forgejo image publication.
# Release candidates pass validation, vulnerability scanning, and signing before promotion.
when:
  - event: manual
  - event: tag
    ref: refs/tags/v*-ym.*

variables:
  - &node_image "dhi.io/node:26.10.0-alpine3.24-dev@sha256:ff2c07e1681b1bcf1747b55ed54b900a327602a37975fb77487e2f795e822dfd"
  - &pnpm_install "corepack enable && pnpm config set store-dir /woodpecker/cache/livesync-bridge/pnpm-store && pnpm install --frozen-lockfile --ignore-scripts"

steps:
  # One container keeps the Corepack shim and installed workspace available to all checks.
  # The pnpm store lives on the shared woodpecker-pipeline-cache volume; the
  # Garage archive restore + rebuild took ~2 min, longer than the checks.
  - name: check
    image: *node_image
    volumes:
      - woodpecker-pipeline-cache:/woodpecker/cache
    commands:
      - *pnpm_install
      - .ci/test-release-policy.sh
      - pnpm run fmt:check
      - pnpm run lint
      - pnpm run typecheck
      # pnpm test bundles the application before running Vitest.
      - pnpm test
      - pnpm audit --audit-level=high

  - name: build-candidate
    image: woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    privileged: true
    when:
      - event: tag
    settings:
      registry: git.m0sh1.cc
      repo: git.m0sh1.cc/m0sh1-internal/livesync-bridge
      dockerfile: Dockerfile
      platforms: [linux/amd64]
      tags:
        - candidate-${CI_COMMIT_SHA}
      cache_from: 'type=registry\,ref=git.m0sh1.cc/m0sh1-internal/livesync-bridge:buildcache'
      cache_to: "type=registry,ref=git.m0sh1.cc/m0sh1-internal/livesync-bridge:buildcache,mode=max,ignore-error=true"
      logins:
        - registry: git.m0sh1.cc
          username:
            from_secret: forgejo_package_username
          password:
            from_secret: forgejo_package_token
        - registry: dhi.io
          username:
            from_secret: dhi_username
          password:
            from_secret: dhi_password
      provenance: mode=max
      sbom: true

  - name: scan-candidate
    image: dhi.io/trivy:0.74.0-alpine3.24-dev@sha256:c0fe6badae7fa331254b3ea3b53ea1e74e7067ce5aa63f6f05e40538963d97b6
    when:
      - event: tag
    environment:
      TRIVY_USERNAME:
        from_secret: forgejo_package_username
      TRIVY_PASSWORD:
        from_secret: forgejo_package_token
    commands:
      - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "git.m0sh1.cc/m0sh1-internal/livesync-bridge:candidate-$${CI_COMMIT_SHA}"

  - name: sign-candidate
    image: dhi.io/cosign:3.1.3-alpine3.24-dev@sha256:e72a27089bde22daa2cc8653011ef55c4a8ecfb7cc5271df62325cd661d77eff
    when:
      - event: tag
    environment:
      COSIGN_EXPERIMENTAL: "1"
      COSIGN_KEY:
        from_secret: cosign_key
      COSIGN_PASSWORD:
        from_secret: cosign_password
      REGISTRY_USERNAME:
        from_secret: forgejo_package_username
      REGISTRY_TOKEN:
        from_secret: forgejo_package_token
    commands:
      - printf '%s' "$${COSIGN_KEY}" > /tmp/cosign.key
      - printf '%s' "$${REGISTRY_TOKEN}" | cosign login git.m0sh1.cc -u "$${REGISTRY_USERNAME}" --password-stdin
      - cosign sign --key /tmp/cosign.key --yes --registry-referrers-mode=oci-1-1 "git.m0sh1.cc/m0sh1-internal/livesync-bridge:candidate-$${CI_COMMIT_SHA}"
      - rm -f /tmp/cosign.key

  - name: promote-release
    image: dhi.io/crane:0.21.9-debian13-dev@sha256:3fb565e1e3aef17a5f7bf9bb697e88cdad502f94b775f8998db7ac94ee164994
    when:
      - event: tag
    environment:
      REGISTRY_USERNAME:
        from_secret: forgejo_package_username
      REGISTRY_TOKEN:
        from_secret: forgejo_package_token
    commands:
      - printf '%s' "$${REGISTRY_TOKEN}" | crane auth login git.m0sh1.cc -u "$${REGISTRY_USERNAME}" --password-stdin
      - candidate="git.m0sh1.cc/m0sh1-internal/livesync-bridge:candidate-$${CI_COMMIT_SHA}"
      - short_sha="$$(printf '%s' "$${CI_COMMIT_SHA}" | cut -c1-8)"
      - crane copy "$${candidate}" "git.m0sh1.cc/m0sh1-internal/livesync-bridge:sha-$${CI_COMMIT_SHA}"
      - crane copy "$${candidate}" "git.m0sh1.cc/m0sh1-internal/livesync-bridge:sha-$${short_sha}"
      - crane copy "$${candidate}" "git.m0sh1.cc/m0sh1-internal/livesync-bridge:${CI_COMMIT_TAG}"
      - crane copy "$${candidate}" git.m0sh1.cc/m0sh1-internal/livesync-bridge:latest
