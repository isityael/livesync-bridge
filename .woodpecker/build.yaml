# LiveSync Bridge validation pipeline for isityael/livesync-bridge.
# GHCR publication, SBOM generation, vulnerability gating, and signing are
# canonicalized in .github/workflows/publish-ghcr.yaml.
when:
  - event: manual
  - event: push
    branch: main
    path:
      include:
        - Dockerfile
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - "**/*.ts"
        - runtime/**
        - scripts/**
        - lib/**
        - .woodpecker/build.yaml
        - .forgejo/workflows/release-tag.yaml
        - hack/wait-for-woodpecker-success.sh
        - .ci/test-release-policy.sh
  - event: pull_request
  - event: tag
    ref: refs/tags/v*-ym.*

variables:
  - &node_image "dhi.io/node:26.8.1-alpine3.24-dev@sha256:22f9b40622a726cf95195d5543460aa387c228a78e3788d9d54c0dc1f6933f12"
  - &pnpm_install "corepack enable && pnpm config set store-dir $CI_WORKSPACE/.pnpm-store && pnpm install --frozen-lockfile --ignore-scripts"

steps:
  - name: restore-pnpm-cache
    image: plugins/cache:1.10@sha256:d7fc21469c57b60320157831fc4703d4f1a4bc3c6b136129cf47f19e60570353
    failure: ignore
    settings:
      access_key: { from_secret: garage_s3_access_key }
      secret_key: { from_secret: garage_s3_secret_key }
      restore: true
      backend: s3
      endpoint: http://garage.garage.svc.cluster.local:3900
      bucket: buildkit-cache
      region: garage
      path_style: true
      archive_format: zstd
      cache_key: 'woodpecker/livesync-bridge/pnpm/amd64/node26-{{ checksum "pnpm-lock.yaml" }}'
      mount: [.pnpm-store]

  - name: pnpm-install
    image: *node_image
    commands:
      - *pnpm_install

  - name: fmt-check
    image: *node_image
    commands:
      - *pnpm_install
      - pnpm run fmt:check

  - name: lint
    image: *node_image
    commands:
      - *pnpm_install
      - pnpm run lint

  - name: typecheck
    image: *node_image
    commands:
      - *pnpm_install
      - pnpm run typecheck

  - name: test
    image: *node_image
    commands:
      - *pnpm_install
      - pnpm test

  - name: dependency-audit
    image: *node_image
    commands:
      - *pnpm_install
      - pnpm audit --audit-level=high

  - name: build
    image: *node_image
    commands:
      - *pnpm_install
      - pnpm run build

  - name: build-candidate
    image: woodpeckerci/plugin-docker-buildx:6.1.1@sha256:9a22c00b4952e405d11e66d29772edbeb1f7b24f27f71cda251ecb838e725e86
    privileged: true
    when:
      - event: tag
    settings:
      registry: ghcr.io
      repo: ghcr.io/isityael/livesync-bridge
      dockerfile: Dockerfile
      platforms: [linux/amd64]
      tags:
        - candidate-${CI_COMMIT_SHA}
      cache_from: 'type=registry\,ref=ghcr.io/isityael/livesync-bridge:buildcache'
      cache_to: "type=registry,ref=ghcr.io/isityael/livesync-bridge:buildcache,mode=max,ignore-error=true"
      logins:
        - registry: ghcr.io
          username:
            from_secret: github_username
          password:
            from_secret: github_token
        - registry: dhi.io
          username:
            from_secret: dhi_username
          password:
            from_secret: dhi_password
      provenance: mode=max

  - name: scan-candidate
    image: dhi.io/trivy:0.74.0-alpine3.24-dev@sha256:65f4193e6e3908dfb2577d258358bb4ef14736425406e657382224d07b0e1d0d
    when:
      - event: tag
    environment:
      TRIVY_USERNAME:
        from_secret: github_username
      TRIVY_PASSWORD:
        from_secret: github_token
    commands:
      - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "ghcr.io/isityael/livesync-bridge:candidate-$${CI_COMMIT_SHA}"

  - name: sign-candidate
    image: dhi.io/cosign:3.1.3-alpine3.24-dev@sha256:c521b07a37c61b63072173270389614ea11c59c965c359bf756499157ae1db35
    when:
      - event: tag
    environment:
      COSIGN_EXPERIMENTAL: "1"
      COSIGN_KEY:
        from_secret: cosign_key
      COSIGN_PASSWORD:
        from_secret: cosign_password
      GHCR_USERNAME:
        from_secret: github_username
      GHCR_TOKEN:
        from_secret: github_token
    commands:
      - printf '%s' "$${COSIGN_KEY}" > /tmp/cosign.key
      - printf '%s' "$${GHCR_TOKEN}" | cosign login ghcr.io -u "$${GHCR_USERNAME}" --password-stdin
      - cosign sign --key /tmp/cosign.key --yes --registry-referrers-mode=oci-1-1 "ghcr.io/isityael/livesync-bridge:candidate-$${CI_COMMIT_SHA}"
      - rm -f /tmp/cosign.key

  - name: promote-release
    image: dhi.io/crane:0.21.9-debian13-dev@sha256:8e4fafa106b0f5ff91ab11d6f2af322dcf6f104e1f2335c3fe1ac73e27e60a35
    when:
      - event: tag
    environment:
      GHCR_USERNAME:
        from_secret: github_username
      GHCR_TOKEN:
        from_secret: github_token
    commands:
      - printf '%s' "$${GHCR_TOKEN}" | crane auth login ghcr.io -u "$${GHCR_USERNAME}" --password-stdin
      - candidate="ghcr.io/isityael/livesync-bridge:candidate-$${CI_COMMIT_SHA}"
      - short_sha="$$(printf '%s' "$${CI_COMMIT_SHA}" | cut -c1-8)"
      - crane copy "$${candidate}" "ghcr.io/isityael/livesync-bridge:sha-$${CI_COMMIT_SHA}"
      - crane copy "$${candidate}" "ghcr.io/isityael/livesync-bridge:sha-$${short_sha}"
      - crane copy "$${candidate}" "ghcr.io/isityael/livesync-bridge:${CI_COMMIT_TAG}"
      - crane copy "$${candidate}" ghcr.io/isityael/livesync-bridge:latest

  - name: rebuild-pnpm-cache
    image: plugins/cache:1.10@sha256:d7fc21469c57b60320157831fc4703d4f1a4bc3c6b136129cf47f19e60570353
    failure: ignore
    when:
      - event: push
        branch: main
      - event: tag
    settings:
      access_key: { from_secret: garage_s3_access_key }
      secret_key: { from_secret: garage_s3_secret_key }
      rebuild: true
      backend: s3
      endpoint: http://garage.garage.svc.cluster.local:3900
      bucket: buildkit-cache
      region: garage
      path_style: true
      archive_format: zstd
      cache_key: 'woodpecker/livesync-bridge/pnpm/amd64/node26-{{ checksum "pnpm-lock.yaml" }}'
      mount: [.pnpm-store]
