name: Create gated fork release tag

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - .forgejo/workflows/release-tag.yaml
      - Dockerfile
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - "**/*.ts"
      - runtime/**
      - scripts/**
      - .ci/**
      - lib
      - lib/**
      - .woodpecker/build.yaml
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'

      - name: Install pnpm and locked dependencies
        run: |
          npm install --global pnpm@12.6.0
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate application and release policy
        run: |
          .ci/test-release-policy.sh
          pnpm run fmt:check
          pnpm run lint
          pnpm run typecheck
          pnpm test
          pnpm audit --audit-level=high

  release:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create immutable release tag
        env:
          FORGEJO_API_URL: ${{ github.server_url }}/api/v1
          FORGEJO_REPOSITORY: ${{ github.repository }}
          FORGEJO_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="$(jq -r .version package.json)"
          series="v${version}-ym"
          max=0
          for tag in $(git tag --list "${series}.*"); do
            revision="${tag#"$series".}"
            case "$revision" in *[!0-9]*|'') continue;; esac
            [ "$revision" -le "$max" ] || max="$revision"
            [ "$(git rev-list -n1 "$tag")" != "$GITHUB_SHA" ] || exit 0
          done
          tag="${series}.$((max+1))"
          curl --fail --silent --show-error --request POST \
            --header "Authorization: token ${FORGEJO_TOKEN}" --header 'Content-Type: application/json' \
            --data "{\"tag_name\":\"${tag}\",\"target\":\"${GITHUB_SHA}\"}" \
            "${FORGEJO_API_URL}/repos/${FORGEJO_REPOSITORY}/tags"
