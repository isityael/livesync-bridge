name: livesync-bridge-integration

services:
  couchdb:
    image: couchdb:3.5.0
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: testpassword
    ports:
      - "5989:5984"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --user admin:testpassword http://127.0.0.1:5984/_up > /dev/null"]
      interval: 1s
      timeout: 5s
      retries: 60
